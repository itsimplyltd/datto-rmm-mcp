# IT Simply push gate: every push to main and every pull request runs the
# registry signature check, the runtime audit, the build and the tests on a
# clean GitHub-hosted runner. Added 2026-10-13. Separate from upstream's CI files.
# Actions pinned by full commit SHA (2 Oct 2026):
#   actions/checkout    v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-node  v7.0.0  820762786026740c76f36085b0efc47a31fe5020
#
# @wyre-* dependencies live on WYRE-AI's GitHub Packages registry, which needs
# a token even to read. secrets.WYRE_PACKAGES_TOKEN is a classic PAT with
# read:packages only: this repo's GITHUB_TOKEN cannot read another org's
# packages (see MCP-Gateway supply-chain-weekly.yml). The token is given only
# to the registry steps, never to build or test, and is never written to disk.

name: ITSL gate

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
      - name: Configure npm for GitHub Packages
        run: |
          printf '%s\n' '@wyre-ai:registry=https://npm.pkg.github.com' '@wyre-technology:registry=https://npm.pkg.github.com' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$RUNNER_TEMP/wyre.npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/wyre.npmrc" >> "$GITHUB_ENV"
      - name: npm ci
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.WYRE_PACKAGES_TOKEN }}
      - name: npm audit signatures
        run: npm audit signatures
        env:
          NODE_AUTH_TOKEN: ${{ secrets.WYRE_PACKAGES_TOKEN }}
      - name: npm audit (runtime, high+)
        run: npm audit --omit=dev --audit-level=high
        env:
          NODE_AUTH_TOKEN: ${{ secrets.WYRE_PACKAGES_TOKEN }}
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
