# IT Simply push gate: every push to main and every pull request runs the
# registry signature check, the build and the tests on a clean
# GitHub-hosted runner. Added 2026-10-13. Separate from upstream's CI files.
# Actions pinned by full commit SHA (2 Oct 2026):
#   actions/checkout    v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-node  v7.0.0  820762786026740c76f36085b0efc47a31fe5020

name: ITSL gate

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
      - name: npm ci
        run: npm ci --ignore-scripts
      - name: npm audit signatures
        run: npm audit signatures
      - name: npm audit (runtime, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
