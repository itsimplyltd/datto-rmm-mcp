# IT Simply PR check: build the Docker image on every pull request that could change it.
# Build only, never pushed: push: false, no registry login, no publish credentials.
# Separate from the upstream CI and release workflows, which build and push on main only.
#
# Paths: image inputs only. Source files are left out on purpose: this repo's CI already
# compiles and tests them on every PR.
#
# AUTH_MODE=gateway means the server takes credentials per request, so it boots with no secrets at all.
#
# Actions pinned by full commit SHA:
#   actions/checkout              v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
#   docker/setup-buildx-action    v4.3.0  37fe631027851001ddb9b187196cc803df7f5f0e
#   docker/build-push-action      v7.3.0  53b7df96c91f9c12dcc8a07bcb9ccacbed38856a

name: ITSL Docker build

on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/itsl-docker-build.yml'

permissions:
  contents: read

concurrency:
  group: itsl-docker-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build image (not pushed)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          provenance: false
          tags: itsl-docker-build:pr
          # The Dockerfile reads ARG GITHUB_TOKEN to write its own .npmrc, so a build-arg is the
          # only way in. Actions masks the value in logs, and the image is never pushed or exported
          # (load: true keeps it in the runner local daemon), so the token cannot leave this job.
          # WYRE_PACKAGES_TOKEN is the org secret itsl-gate.yml uses; the GITHUB_TOKEN fallback is for
          # Dependabot and fork PRs, which get no org secrets (the upstream release workflow also
          # uses GITHUB_TOKEN here).
          build-args: |
            GITHUB_TOKEN=${{ secrets.WYRE_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Smoke test (container stays up and /health answers)
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8080:8080 \
            -e MCP_TRANSPORT=http \
            -e AUTH_MODE=gateway \
            itsl-docker-build:pr
          ok=0
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
              echo "::error::container exited during startup"; docker logs smoke; exit 1
            fi
            if curl -fsS "http://127.0.0.1:8080/health"; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then echo "::error::/health never answered"; docker logs smoke; exit 1; fi
          sleep 5
          if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
            echo "::error::container died after starting"; docker logs smoke; exit 1
          fi
          docker logs smoke
